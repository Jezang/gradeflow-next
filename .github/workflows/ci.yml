name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gradeflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Application regression tests
        run: |
          npm run test:ranking
          npm run test:reports
          npm run test:migration
          npm run test:backup
          npm run test:line
          npm run test:portal
          node --experimental-strip-types --disable-warning=ExperimentalWarning --test tests/gradebook-previews.test.mjs tests/score-export-xlsx.test.mjs tests/school-import-export.test.mjs
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Test rules with local emulator only
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-gradeflow "npm run test:rules && npm run test:recovery"
