name: Publish Firebase rules
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH gradeflow-next to replace production Firestore rules'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gradeflow-production-rules
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Jezang/gradeflow-next' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH gradeflow-next'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-gradeflow "npm run test:rules && npm run test:recovery"
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current main and authorization configuration
        env:
          GH_TOKEN: ${{ github.token }}
          WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_RULES_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test "$GITHUB_SHA" = "$(gh api repos/Jezang/gradeflow-next/git/ref/heads/main --jq .object.sha)"
          test -n "$WIF_PROVIDER" && test -n "$SERVICE_ACCOUNT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_RULES_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Publish only Firestore security rules
        run: npx --yes firebase-tools@14 deploy --only firestore:rules --project gradeflow-next --non-interactive
